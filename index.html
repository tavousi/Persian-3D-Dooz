<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دوز سه‌بعدی ایرانی | Persian 3D Dooz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --persian-blue:#1b2a5b; --crimson:#8e1f34; --burgundy:#5c1220;
  --turquoise:#1fb6a6; --turquoise-light:#5eead4;
  --gold:#d4af37; --gold-light:#f5d67b; --gold-dark:#8a6d1c;
  --ivory:#f7f0dd;
  --card:rgba(16,12,28,.66); --card-border:rgba(212,175,55,.38);
  --shadow:0 18px 60px rgba(0,0,0,.55);
  --font:'Vazirmatn',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--ivory);overflow:hidden;
  background:linear-gradient(180deg,#0b0a18 0%,#141026 45%,#0b0a18 100%);
}
/* ===== FULLSCREEN SCENE ===== */
#scene-container{position:fixed;inset:0;z-index:0;cursor:pointer;
  background:radial-gradient(ellipse at 50% 30%,#221c44 0%,#100d24 60%,#070612 100%)}
#scene-container canvas{display:block;width:100%!important;height:100%!important;outline:none}
/* ===== HUD ===== */
.hud{position:fixed;z-index:10;pointer-events:none}
.hud > *{pointer-events:auto}
.glass{background:var(--card);border:1px solid var(--card-border);border-radius:16px;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
/* top center bar */
#topbar{top:10px;right:50%;transform:translateX(50%);display:flex;align-items:center;gap:10px;
  padding:8px 16px;max-width:min(94vw,660px);white-space:nowrap}
[dir="ltr"] #topbar{right:auto;left:50%;transform:translateX(-50%)}
#topbar .logo-mini{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#f5d67b 0%,#d4af37 22%,#8e1f34 48%,#1b2a5b 72%,#0d1430 100%);
  border:1.5px solid var(--gold);font-size:18px}
#topbar .tt{font-weight:900;font-size:clamp(13px,2.4vw,17px);
  background:linear-gradient(180deg,#fff7d6,var(--gold-light) 35%,var(--gold) 60%,#f5d67b);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#statusPill{font-size:12px;font-weight:800;background:rgba(0,0,0,.45);border:1px solid var(--card-border);
  padding:5px 12px;border-radius:999px;color:var(--gold-light);overflow:hidden;text-overflow:ellipsis;max-width:46vw}
/* player chips */
.pchip{position:fixed;top:10px;z-index:10;display:flex;align-items:center;gap:10px;padding:9px 14px;
  transition:all .3s;max-width:44vw}
#p1chip{left:10px} #p2chip{right:10px}
.pchip .avatar{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
  font-size:22px;font-weight:900;border:1px solid rgba(255,255,255,.2)}
#p1chip .avatar{background:radial-gradient(circle at 30% 25%,#ffe9a3,var(--gold) 40%,#5c470e 80%);color:#2a2005}
#p2chip .avatar{background:radial-gradient(circle at 30% 25%,#c8ffef,var(--turquoise) 40%,#062a26 90%);color:#03211e}
.pchip .nm{font-size:13.5px;font-weight:800;line-height:1.3}
.pchip .sc{font-size:11.5px;color:#cbbf9a;font-weight:700}
.pchip .sc b{color:#fff;font-size:16px;font-variant-numeric:tabular-nums}
.pchip .pcs{font-size:11px;color:var(--turquoise-light);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pchip .dot{width:9px;height:9px;border-radius:50%;background:#444;flex:0 0 9px}
.pchip.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 34px rgba(212,175,55,.25)}
.pchip.active .dot{background:#4ade80;box-shadow:0 0 10px #4ade80;animation:blink 1s infinite}
.pchip.winner-glow{animation:winGlow 1.1s ease-in-out infinite alternate}
@keyframes blink{50%{opacity:.4}}
@keyframes winGlow{from{box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(212,175,55,.35)}to{box-shadow:0 0 0 2px var(--gold-light),0 0 44px rgba(212,175,55,.7)}}
/* rules chip under topbar */
#rulesChip{top:64px;right:50%;transform:translateX(50%);font-size:11.5px;font-weight:700;color:#d8c99a;
  background:rgba(0,0,0,.5);border:1px solid rgba(212,175,55,.3);padding:4px 14px;border-radius:999px;white-space:nowrap;cursor:pointer}
[dir="ltr"] #rulesChip{right:auto;left:50%;transform:translateX(-50%)}
#rulesChip:hover{border-color:var(--gold)}
/* bottom corners */
.corner{position:fixed;bottom:12px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;max-width:46vw}
#bl{left:12px} #br{right:12px;justify-content:flex-end}
.btn{
  font-family:var(--font);font-weight:800;font-size:13px;border-radius:12px;padding:10px 15px;cursor:pointer;
  border:1px solid var(--card-border);color:var(--ivory);background:rgba(14,10,26,.72);
  backdrop-filter:blur(12px);transition:all .2s;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 8px 24px rgba(0,0,0,.45)}
.btn:hover{transform:translateY(-2px);border-color:var(--gold)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--gold-light),var(--gold) 55%,#9c7d22);color:#261b04;border-color:#f5d67b}
.btn.teal{background:linear-gradient(180deg,#5eead4,#14a897 60%,#0b6b60);color:#03211e;border-color:#5eead4}
.btn.danger{border-color:rgba(255,120,120,.45);color:#ffc9c9}
.icon-btn{min-width:44px;height:42px;border-radius:12px;border:1px solid var(--card-border);
  background:rgba(14,10,26,.72);color:var(--gold-light);font-size:17px;cursor:pointer;
  display:inline-grid;place-items:center;padding:0 10px;backdrop-filter:blur(12px);transition:all .2s;font-family:var(--font);font-weight:800;font-size:13px}
.icon-btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.icon-btn.off{opacity:.45;filter:grayscale(1)}
.lang-mini{display:flex;background:rgba(14,10,26,.72);border:1px solid var(--card-border);border-radius:12px;padding:3px;gap:3px;backdrop-filter:blur(12px)}
.lang-mini button{border:0;cursor:pointer;font-family:var(--font);font-weight:800;font-size:12.5px;padding:8px 13px;border-radius:9px;background:transparent;color:#cbbf9a;transition:all .2s}
.lang-mini button.active{background:linear-gradient(180deg,var(--gold-light),var(--gold) 60%,#a68424);color:#241a05}
/* hint */
#hint{bottom:12px;right:50%;transform:translateX(50%);font-size:11.5px;background:rgba(0,0,0,.55);
  border:1px solid rgba(212,175,55,.3);color:#e8dcc0;padding:6px 16px;border-radius:999px;
  pointer-events:none!important;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
[dir="ltr"] #hint{right:auto;left:50%;transform:translateX(-50%)}
/* ===== MODALS ===== */
.overlay{position:fixed;inset:0;background:rgba(5,4,15,.72);backdrop-filter:blur(8px);display:grid;
  place-items:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;padding:14px}
.overlay.show{opacity:1;pointer-events:auto}
#setOverlay{z-index:60}
.modal{width:min(520px,100%);max-height:92dvh;overflow-y:auto;background:linear-gradient(180deg,#221b3d,#131024 60%,#0c0a1c);
  border:1px solid var(--gold);border-radius:22px;padding:24px 22px;text-align:center;
  box-shadow:0 30px 100px rgba(0,0,0,.7),0 0 60px rgba(212,175,55,.15);
  transform:scale(.92) translateY(14px);transition:transform .3s cubic-bezier(.2,1.4,.4,1);position:relative}
.overlay.show .modal{transform:none}
.modal::before{content:'❁';position:absolute;top:8px;inset-inline-end:16px;color:rgba(212,175,55,.25);font-size:26px}
.modal h2{margin:4px 0 2px;font-size:21px;font-weight:900}
.modal .sub{margin:0 0 14px;color:#cbbf9a;font-size:12.5px}
.set-group{margin:14px 0;text-align:start}
.set-group > label{display:block;font-size:13px;font-weight:800;color:var(--gold-light);margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;font-family:var(--font);font-weight:800;font-size:13.5px;cursor:pointer;
  padding:10px 6px;border-radius:12px;border:1px solid rgba(212,175,55,.3);background:rgba(0,0,0,.4);
  color:#d8c99a;transition:all .2s}
.seg button small{display:block;font-size:10.5px;font-weight:500;opacity:.75;margin-top:2px}
.seg button.sel{background:linear-gradient(180deg,var(--gold-light),var(--gold) 60%,#9c7d22);color:#261b04;border-color:#f5d67b;box-shadow:0 6px 18px rgba(212,175,55,.35)}
.seg button:disabled{opacity:.28;cursor:not-allowed}
#cfgSummary{margin:14px 0;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:800;
  background:rgba(212,175,55,.1);border:1px dashed rgba(212,175,55,.5);color:var(--gold-light);line-height:2}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.modal .note{font-size:11.5px;color:#9a90b5;margin-top:10px;line-height:1.9}
.modal .toranj{width:74px;height:74px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:38px;
  background:radial-gradient(circle at 50% 35%,#f5d67b,#d4af37 30%,#8e1f34 60%,#1b2a5b 85%);
  border:2px solid var(--gold-light);box-shadow:0 0 34px rgba(212,175,55,.5)}
.modal p.desc{margin:6px 0 14px;color:#d8c99a;font-size:14px;line-height:1.9}
.help-list{margin:0;padding:0;list-style:none;font-size:13px;line-height:2.1;color:#e6dcc2;text-align:start}
.help-list li{display:flex;gap:8px;align-items:flex-start}
.help-list li::before{content:'◆';color:var(--gold);flex:0 0 auto;margin-top:2px;font-size:10px}
/* main menu mode cards */
.menu-modal{width:min(600px,100%)}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mode-card{font-family:var(--font);cursor:pointer;border-radius:18px;padding:16px 12px;
  border:1.5px solid rgba(212,175,55,.3);background:rgba(0,0,0,.4);color:var(--ivory);transition:all .25s}
.mode-card svg{width:74px;height:74px;margin-bottom:8px}
.mode-card b{display:block;font-size:15px;font-weight:900}
.mode-card small{display:block;font-size:11.5px;color:#cbbf9a;margin-top:6px;line-height:1.9}
.mode-card.sel{border-color:var(--gold-light);background:rgba(212,175,55,.1);box-shadow:0 0 0 1px var(--gold),0 10px 30px rgba(212,175,55,.2)}
.mode-card:hover{transform:translateY(-3px)}
#menuSummary{font-size:13px;font-weight:800;color:var(--gold-light);background:rgba(212,175,55,.08);
  border:1px dashed rgba(212,175,55,.5);border-radius:12px;padding:9px 14px;line-height:2}
/* toast */
#toast{position:fixed;bottom:64px;right:50%;transform:translateX(50%) translateY(16px);background:rgba(20,10,14,.93);
  border:1px solid var(--gold);color:var(--ivory);padding:10px 22px;border-radius:999px;font-size:13px;font-weight:700;
  z-index:70;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 12px 30px rgba(0,0,0,.5);
  white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
[dir="ltr"] #toast{right:auto;left:50%;transform:translateX(-50%) translateY(16px)}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}
[dir="ltr"] #toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{border-color:#ff7b7b;color:#ffd1d1}
.lang-fade{animation:langFade .3s ease}
@keyframes langFade{from{opacity:.2}to{opacity:1}}
@media(max-width:760px){
  #topbar{top:64px;padding:6px 12px}
  #rulesChip{top:110px}
  .pchip{padding:6px 10px}.pchip .avatar{width:34px;height:34px;flex-basis:34px;font-size:18px}
  .pchip .nm{font-size:12px}.pchip .pcs{font-size:10px}
  .corner{bottom:8px}.corner .btn span.t{display:none}
  .corner .btn{padding:10px 12px;font-size:15px}
  #hint{display:none}
  .mode-cards{grid-template-columns:1fr}
}
</style>
</head>

</div>

<div class="corner" id="br">

</div>
<div class="hud" id="hint">…</div>

<!-- MAIN MENU -->
<div class="overlay" id="menuOverlay">
  <div class="modal menu-modal">

    <h2 data-i18n="menuTitle">انتخاب حالت بازی</h2>

    <div class="mode-cards">
      <button class="mode-card" id="card3">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="7" y="7" width="50" height="50" rx="9" stroke="#d4af37" stroke-width="3"/>
          <path d="M25 7v50M39 7v50M7 25h50M7 39h50" stroke="#d4af37" stroke-width="2" opacity=".7"/>
          <circle cx="18" cy="18" r="4.5" fill="#d4af37"/>
          <path d="M44 14l8 8M52 14l-8 8" stroke="#1fb6a6" stroke-width="3.4" stroke-linecap="round"/>
          <circle cx="18" cy="46" r="4.5" fill="#1fb6a6"/>
        </svg>
        <b data-i18n="mode3">دوز سه‌تایی</b>
        <small data-i18n="mode3desc">صفحه ۳×۳ کلاسیک • سه مهره در یک ردیف</small>
      </button>
      <button class="mode-card" id="card12">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="6" y="6" width="52" height="52" rx="4" stroke="#d4af37" stroke-width="2.6"/>
          <rect x="17" y="17" width="30" height="30" stroke="#d4af37" stroke-width="2.2"/>
          <rect x="27" y="27" width="10" height="10" stroke="#d4af37" stroke-width="2"/>
          <path d="M32 6v11M32 47v11M6 32h11M47 32h11" stroke="#d4af37" stroke-width="2"/>
          <path d="M6 6l11 11M58 6L47 17M6 58l11-11M58 58L47 47" stroke="#d4af37" stroke-width="2"/>
          <circle cx="6" cy="6" r="2.6" fill="#1fb6a6"/><circle cx="58" cy="6" r="2.6" fill="#1fb6a6"/>
          <circle cx="6" cy="58" r="2.6" fill="#1fb6a6"/><circle cx="58" cy="58" r="2.6" fill="#1fb6a6"/>
          <circle cx="32" cy="6" r="2.6" fill="#d4af37"/><circle cx="32" cy="58" r="2.6" fill="#d4af37"/>
          <circle cx="6" cy="32" r="2.6" fill="#d4af37"/><circle cx="58" cy="32" r="2.6" fill="#d4af37"/>

        <b data-i18n="mode12">دوز دوازده‌تایی</b>
        <small data-i18n="mode12desc">صفحه سنتی ۲۴ نقطه‌ای • ۱۲ مهره برای هر بازیکن</small>

    <div id="menuSummary">…</div>
    <div class="row">
      <button class="btn primary" id="btnStart">▶ <span data-i18n="startGame">شروع بازی</span></button>
      <button class="btn" id="btnMenuSettings">⚙ <span data-i18n="settings">تنظیمات</span></button>
    </div>
  </div>
</div>

<!-- WIN MODAL -->
<div class="overlay" id="winOverlay">
  <div class="modal">
    <div class="toranj" id="winEmoji">🏆</div>
    <h2 id="winTitle">…</h2>
    <p class="desc" id="winDesc">…</p>
    <div class="row">
      <button class="btn primary" id="btnWinAgain">↻ <span data-i18n="playAgain">دوباره</span></button>
      <button class="btn" id="btnWinClose">✕ <span data-i18n="close">بستن</span></button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="overlay" id="setOverlay">
  <div class="modal">
    <div class="toranj">⚙</div>
    <h2 data-i18n="settings">تنظیمات</h2>

      <label data-i18n="sound">صدا</label>

    </div>

      <label data-i18n="animations">انیمیشن‌ها</label>

      <label data-i18n="showRules">نمایش خودکار راهنما</label>

    <div class="set-group">
      <label data-i18n="language">زبان</label>

    <div id="cfgSummary">…</div>
    <div class="row">
      <button class="btn primary" id="btnApply">✓ <span data-i18n="apply">اعمال</span></button>

  </div>
</div>

<!-- HELP MODAL -->

  <div class="modal">
    <div class="toranj">❁</div>
    <h2 data-i18n="helpTitle">راهنمای بازی دوز</h2>
    <ul class="help-list" id="helpList"></ul>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="btnHelpClose">✓ <span data-i18n="close">بستن</span></button></div>
  </div>
</div>

<div id="toast"></div>

function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(freq,t0,dur,type='sine',vol=.22){
  if(!soundOn) return; const c=ac(); if(!c) return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol,c.currentTime+t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+dur);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+0.05);
}

/* ---------- procedural art (Persian identity) ---------- */
function drawBoteh(ctx,x,y,s,rot,fill,stroke){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.beginPath();ctx.moveTo(0,-30);
  ctx.bezierCurveTo(22,-28,26,-6,20,8);ctx.bezierCurveTo(16,18,6,22,2,32);
  ctx.bezierCurveTo(0,36,-4,34,-3,28);ctx.bezierCurveTo(4,20,-6,18,-10,8);
  ctx.bezierCurveTo(-16,-6,-10,-26,0,-30);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke();
  ctx.beginPath();ctx.arc(3,-2,7,0,Math.PI*2);ctx.fillStyle=stroke;ctx.fill();
  ctx.beginPath();ctx.arc(3,-2,3,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
  ctx.restore();
}
function drawFlower(ctx,x,y,r,petal,center){
  ctx.save();ctx.translate(x,y);
  for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);
    ctx.beginPath();ctx.ellipse(0,-r,r*0.42,r,0,0,Math.PI*2);
    ctx.fillStyle=petal;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();}
  ctx.beginPath();ctx.arc(0,0,r*0.5,0,Math.PI*2);ctx.fillStyle=center;ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle='#3d2f0a';ctx.stroke();ctx.restore();
}
function makeCarpetTexture(N){
  const S=1024,c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d');
  const subtle = N>=5 ? 0.55 : 1;
  x.fillStyle='#101a3a';x.fillRect(0,0,S,S);
  x.strokeStyle='#d4af37';x.lineWidth=10;x.strokeRect(14,14,S-28,S-28);
  x.strokeStyle='#f5d67b';x.lineWidth=3;x.strokeRect(28,28,S-56,S-56);
  x.fillStyle='#1b2a5b';x.fillRect(40,40,S-80,S-80);
  const nb = N>=5?9:12;
  for(let i=0;i<nb;i++){
    const px=80+i*((S-160)/(nb-1));
    drawBoteh(x,px,86,1.0,Math.PI,'#8e1f34','#f5d67b');
    drawBoteh(x,px,S-86,1.0,0,'#8e1f34','#f5d67b');
    const py=80+i*((S-160)/(nb-1));
    drawBoteh(x,86,py,1.0,Math.PI/2,'#1fb6a6','#f5d67b');
    drawBoteh(x,S-86,py,1.0,-Math.PI/2,'#1fb6a6','#f5d67b');
  }
  x.fillStyle='#f0e6cb';x.fillRect(130,130,S-260,S-260);
  x.strokeStyle='#8a6d1c';x.lineWidth=4;x.strokeRect(130,130,S-260,S-260);
  for(let i=0;i<8;i++){drawFlower(x,190+i*((S-380)/7),178,12,'#8e1f34','#d4af37');drawFlower(x,190+i*((S-380)/7),S-178,12,'#1b2a5b','#1fb6a6');}
  const f0=190,f1=S-190;
  const g=x.createRadialGradient(S/2,S/2,80,S/2,S/2,520);
  g.addColorStop(0,'#a3273f');g.addColorStop(.55,'#7b1e2b');g.addColorStop(1,'#4d0f1d');
  x.fillStyle=g;x.fillRect(f0,f0,f1-f0,f1-f0);
  x.strokeStyle=`rgba(212,175,55,${0.22*subtle+0.08})`;x.lineWidth=1.5;
  for(let i=0;i<=N*2;i++){const p=f0+i*((f1-f0)/(N*2));
    x.beginPath();x.moveTo(p,f0);x.lineTo(p,f1);x.stroke();
    x.beginPath();x.moveTo(f0,p);x.lineTo(f1,p);x.stroke();}
  const dens = N<=3?6:(N===4?7:8);
  for(let r=0;r<dens;r++)for(let col=0;col<dens;col++){
    const px=f0+40+col*((f1-f0-80)/(dens-1)),py=f0+40+r*((f1-f0-80)/(dens-1));
    if(Math.abs(px-S/2)<140&&Math.abs(py-S/2)<140) continue;
    x.globalAlpha=subtle;
    drawFlower(x,px,py,N>=5?8:10,(r+col)%2?'#d4af37':'#1fb6a6','#f7f0dd');
    x.globalAlpha=1;
  }
  x.fillStyle='#1b2a5b';
  [[f0,f0],[f1,f0],[f0,f1],[f1,f1]].forEach(([cx,cy])=>{
    x.save();x.beginPath();x.moveTo(cx,cy);
    x.quadraticCurveTo(cx+(cx<f1?190:-190),cy,cx+(cx<f1?190:-190),cy+(cy<f1?190:-190));

function updateTweens(now){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];if(now<tw.t0)continue;
    const k=Math.min(1,(now-tw.t0)/tw.dur);
    tw.update(tw.ease?tw.ease(k):k,k);
    if(k>=1){tweens.splice(i,1);tw.done&&tw.done();}
  }
}
const easeOutBack=k=>{const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};

function updateBursts(dt){
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];b.userData.life+=dt;
    const p=b.geometry.attributes.position,v=b.userData.vel;
    for(let k=0;k<v.length;k++){p.array[k*3]+=v[k].x*dt;p.array[k*3+1]+=v[k].y*dt;p.array[k*3+2]+=v[k].z*dt;v[k].y-=5*dt;}

const SQ_HALF=[3.35,2.2,1.05];
function sqXZ(s,p){const H=SQ_HALF[s];
  switch(p){case 0:return[-H,-H];case 1:return[0,-H];case 2:return[H,-H];
    case 3:return[H,0];case 4:return[H,H];case 5:return[0,H];
    case 6:return[-H,H];default:return[-H,0];}}
const N12ID=(s,p)=>s*8+p;

const ADJ12=Array.from({length:24},()=>[]);
(function buildGraph(){
  const link=(a,b)=>{ADJ12[a].push(b);ADJ12[b].push(a);};
  for(let s=0;s<3;s++)for(let p=0;p<8;p++)link(N12ID(s,p),N12ID(s,(p+1)%8)); // square perimeters
  [1,3,5,7].forEach(p=>{link(N12ID(0,p),N12ID(1,p));link(N12ID(1,p),N12ID(2,p));}); // radial midpoints
  [0,2,4,6].forEach(p=>{link(N12ID(0,p),N12ID(1,p));link(N12ID(1,p),N12ID(2,p));}); // diagonal corners
})();

for(let s=0;s<3;s++)for(let k=0;k<4;k++){const p0=k*2;MILLS12.push([N12ID(s,p0),N12ID(s,p0+1),N12ID(s,(p0+2)%8)]);}

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
let hoverIdx=-1;
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  ptr.x=((e.clientX-r.left)/r.width)*2-1;
  ptr.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ptr,camera);
  const m=ray.intersectObjects(hits,false);
  return m.length?m[0].object.userData.index:-1;
}
renderer.domElement.addEventListener('pointermove',e=>{
  if(gameOver||!hits.length) return;
  hoverIdx=pick(e);
  if(mode==='12')refresh12();
  else tiles.forEach((tl,i)=>{
    const hot=i===hoverIdx&&board[i]===0;
    tl.material.opacity=hot?0.28:0.07;
    tl.material.emissive=new THREE.Color(hot?(current===1?0x664d00:0x00443d):0x000000);
  });
  const occupied = hoverIdx>=0 && (mode==='12'?m12.cells[hoverIdx]!==0:board[hoverIdx]!==0);
  renderer.domElement.style.cursor=hoverIdx>=0&&!occupied?'pointer':'grab';
});
renderer.domElement.addEventListener('pointerdown',e=>{
  ac();const i=pick(e);if(i<0)return;
  if(mode==='12')m12tap(i);else doMove(i);
});

/* ================= MODE 1 LOGIC (classic, untouched) ================= */
function findWin(){
  const N=cfg.size,W=cfg.win;
  const at=(r,c)=>board[r*N+c];
  for(let r=0;r<N;r++)for(let c=0;c<=N-W;c++){
    const v=at(r,c);if(!v)continue;let ok=true;
    for(let k=1;k<W;k++)if(at(r,c+k)!==v){ok=false;break;}
    if(ok)return Array.from({length:W},(_,k)=>r*N+c+k);
  }
  for(let c=0;c<N;c++)for(let r=0;r<=N-W;r++){
    const v=at(r,c);if(!v)continue;let ok=true;
    for(let k=1;k<W;k++)if(at(r+k,c)!==v){ok=false;break;}
    if(ok)return Array.from({length:W},(_,k)=>(r+k)*N+c);
  }
  for(let r=0;r<=N-W;r++)for(let c=0;c<=N-W;c++){
    const v=at(r,c);if(!v)continue;let ok=true;
    for(let k=1;k<W;k++)if(at(r+k,c+k)!==v){ok=false;break;}
    if(ok)return Array.from({length:W},(_,k)=>(r+k)*N+c+k);
  }
  for(let r=0;r<=N-W;r++)for(let c=W-1;c<N;c++){
    const v=at(r,c);if(!v)continue;let ok=true;
    for(let k=1;k<W;k++)if(at(r+k,c-k)!==v){ok=false;break;}
    if(ok)return Array.from({length:W},(_,k)=>(r+k)*N+c-k);
  }
  return null;
}
function doMove(i){
  if(gameOver){toast(t('gameOver'),true);return;}
  if(board[i]!==0){sInvalid();toast(t('occupied'),true);
    const tl=tiles[i],t0=performance.now(),ox=tl.position.x;
    addTween({t0,dur:350,update:e=>{tl.position.x=ox+Math.sin(e*Math.PI*4)*0.09*(1-e);}});
    return;
  }
  board[i]=current;
  (current===1?sPlace1:sPlace2)();
  spawnPieceMesh(current,cellPos(i),pieceScale,pieceMeshes,i);
  const w=findWin();
  if(w){onWin(w);return;}
  if(board.every(v=>v!==0)){onDraw();return;}
  current=current===1?2:1;sTurn();updateUI();
  const t0=performance.now();
  addTween({t0,dur:300,update:e=>{boardGroup.position.y=Math.sin(e*Math.PI)*0.05;}});
}
function onWin(combo){
  gameOver=true;curScores()[current]++;saveScores();sWin();showWinLine(combo);
  combo.forEach((ci,k)=>{
    const m=pieceMeshes[ci];if(!m)return;
    const t0=performance.now()+k*110;
    addTween({t0,dur:1400,update:e=>{
      m.scale.setScalar(pieceScale*(1+Math.sin(e*Math.PI*4)*0.12));
      m.position.y=0.28+Math.sin(e*Math.PI*2)*0.25;
      m.rotation.y+=0.03;
    },done:()=>{if(m)m.scale.setScalar(pieceScale*1.12);}});
  });
  const t0=performance.now(),az0=controls.getAzimuthalAngle();
  addTween({t0,dur:2600,update:e=>{
    const a=az0+e*0.6,r=camHome.length()-e*1.4;
    camera.position.set(Math.sin(a)*r,camHome.y-e*1.6,Math.cos(a)*r);
  }});
  updateUI();
  setTimeout(()=>{
    document.getElementById('winEmoji').textContent=current===1?'✕':'○';
    document.getElementById('winTitle').textContent=t('winner');
    document.getElementById('winDesc').textContent=t('winDesc',{p:playerName(current),w:fmt(cfg.win)});
    document.getElementById('winOverlay').classList.add('show');
    document.getElementById(current===1?'p1chip':'p2chip').classList.add('winner-glow');
  },900);
}
function onDraw(){
  gameOver=true;curScores().draws++;saveScores();sDrawS();
  const t0=performance.now();
  addTween({t0,dur:1200,update:e=>{
    tiles.forEach((tl,i)=>{tl.material.opacity=0.07+Math.sin(e*Math.PI*3+i)*0.06+0.06;});
  }});
  updateUI();
  setTimeout(()=>{
    document.getElementById('winEmoji').textContent='🤝';
    document.getElementById('winTitle').textContent=t('drawTitle');
    document.getElementById('winDesc').textContent=t('drawDesc');
    document.getElementById('winOverlay').classList.add('show');

}

/* ================= MODE 2 LOGIC (12-piece graph Dooz) ================= */
const m12count=p=>m12.cells.filter(v=>v===p).length;
function closedMillsContaining(node,player){
  return MILLS12.filter(m=>m.includes(node)&&m.every(n=>m12.cells[n]===player));
}
function victimMillNodes(victim){
  const s=new Set();
  MILLS12.forEach(m=>{if(m.every(n=>m12.cells[n]===victim))m.forEach(n=>s.add(n));});
  return s;
}
function m12removable(i){
  const victim=3-current;
  if(m12.cells[i]!==victim)return false;
  const inMill=victimMillNodes(victim);
  const free=[...Array(24).keys()].filter(n=>m12.cells[n]===victim&&!inMill.has(n));
  if(free.length>0)return !inMill.has(i);   // protected mills while free pieces exist
  return true;                               // all in mills → any removable
}
function isTarget(k){
  if(m12.cells[k]!==0||m12.selected<0)return false;
  if(FLY&&m12count(current)===3)return true;
  return ADJ12[m12.selected].includes(k);
}
function hasLegalMove(p){
  if(FLY&&m12count(p)===3)return m12.cells.some(v=>v===0);
  for(let n=0;n<24;n++){
    if(m12.cells[n]!==p)continue;
    if(ADJ12[n].some(a=>m12.cells[a]===0))return true;
  }
  return false;
}
function m12tap(i){
  if(gameOver){toast(t('gameOver'),true);return;}
  clearWinFxSilent();
  if(m12.removing){
    if(m12.cells[i]===3-current&&m12removable(i)){m12remove(i);return;}
    sInvalid();toast(t('mustRemove'),true);return;
  }
  if(m12.phase==='place'){
    if(m12.cells[i]!==0){sInvalid();toast(t('occupied'),true);return;}
    m12.cells[i]=current;m12.hand[current]--;
    (current===1?sPlace1:sPlace2)();
    spawnPieceMesh(current,nodeVec(i),0.5,pieceMeshes,i);
    const mills=closedMillsContaining(i,current);
    if(mills.length){m12enterRemoval(mills);return;}
    m12endTurn();
    return;
  }
  // movement phase
  if(m12.cells[i]===current){
    m12.selected=(m12.selected===i)?-1:i;
    m12.millNodes=[];
    sSelect();refresh12();updateUI();return;
  }
  if(m12.selected>=0&&isTarget(i)){m12move(m12.selected,i);return;}
  if(m12.cells[i]!==0){sInvalid();toast(t(m12.selected>=0?'invalidTarget':'notYours'),true);return;}
  sInvalid();toast(t('selectOwn'),true);
}
function m12enterRemoval(mills){
  m12.removing=true;m12.selected=-1;
  m12.millNodes=[...new Set(mills.flat())];
  sDooz();showMillBeam(mills[0]);
  burstAt(new THREE.Vector3(nodeVec(mills[0][1]).x,1.2,nodeVec(mills[0][1]).z),0xffd76a,60);
  // celebratory pulse on mill pieces
  m12.millNodes.forEach((ni,k)=>{
    const m=pieceMeshes[ni];if(!m)return;
    const t0=performance.now()+k*100;
    addTween({t0,dur:1100,update:e=>{
      m.scale.setScalar(0.5*(1+Math.sin(e*Math.PI*3)*0.14));
      m.position.y=0.28+Math.sin(e*Math.PI*2)*0.2;
    },done:()=>{if(pieceMeshes[ni])pieceMeshes[ni].scale.setScalar(0.5);}});
  });
  toast(t('dooz')+' '+t('removeOne'));
  refresh12();updateUI();
}
function m12remove(i){
  m12.cells[i]=0;
  const m=pieceMeshes[i];pieceMeshes[i]=null;m12.meshes[i]=null;
  const pos=m?m.position.clone():new THREE.Vector3(nodeVec(i).x,0.8,nodeVec(i).z);
  sRemove();
  burstAt(pos,0xff6b6b,52);
  if(m){
    const t0=performance.now(),y0=m.position.y;
    addTween({t0,dur:500,update:e=>{
      m.scale.setScalar(Math.max(0.01,0.5*(1-e)));
      m.position.y=y0-e*1.2;m.rotation.y+=0.12;
    },done:()=>{boardGroup.remove(m);}});
  }
  m12.removing=false;m12.millNodes=[];
  clearWinFx();
  if(m12.phase==='move'&&m12count(3-current)<3){m12win(current,'2');return;}
  m12endTurn();
}
function m12move(from,to){
  m12.cells[to]=current;m12.cells[from]=0;
  const m=pieceMeshes[from];pieceMeshes[from]=null;pieceMeshes[to]=m;m12.meshes[to]=m;m12.meshes[from]=null;
  m12.selected=-1;m12.millNodes=[];
  sMoveS();
  if(m){
    const a=nodeVec(from),b=nodeVec(to);
    const t0=performance.now(),r0=m.rotation.y;
    addTween({t0,dur:480,update:e=>{
      m.position.x=a.x+(b.x-a.x)*e;
      m.position.z=a.z+(b.z-a.z)*e;
      m.position.y=0.28+Math.sin(e*Math.PI)*0.9;
      m.rotation.y=r0+e*0.8;
    },done:()=>{m.position.set(b.x,0.28,b.z);}});
  }
  burstAt(new THREE.Vector3(nodeVec(to).x,0.6,nodeVec(to).z),current===1?0xffd76a:0x5eead4,26,1.6,2.0);
  const mills=closedMillsContaining(to,current);
  if(mills.length){setTimeout(()=>{if(!gameOver)m12enterRemoval(mills);},ANIM?420:10);refresh12();updateUI();return;}
  m12endTurn();
}
function m12endTurn(){
  if(m12.phase==='place'&&m12.hand[1]===0&&m12.hand[2]===0){
    m12.phase='move';toast(t('toMove'));sTurn();
  }
  current=current===1?2:1;
  m12.selected=-1;m12.removing=false;m12.millNodes=[];
  if(m12.phase==='move'&&!hasLegalMove(current)){m12win(3-current,'blocked');return;}
  updateUI();refresh12();
}
function m12win(w,reason){
  gameOver=true;curScores()[w]++;saveScores();sWin();
  // celebrate winner's remaining pieces
  pieceMeshes.forEach((m,ni)=>{
    if(!m||m12.cells[ni]!==w)return;
    const t0=performance.now()+Math.random()*300;
    addTween({t0,dur:1500,update:e=>{
      m.scale.setScalar(0.5*(1+Math.sin(e*Math.PI*4)*0.12));
      m.position.y=0.28+Math.abs(Math.sin(e*Math.PI*2))*0.3;
    },done:()=>{if(pieceMeshes[ni])pieceMeshes[ni].scale.setScalar(0.56);}});
  });
  const wp=nodeVec(m12.cells.indexOf(w));
  burstAt(new THREE.Vector3(wp.x,1.4,wp.z),0xffd76a,90,4,4.5);
  winLight.intensity=36;
  const t0=performance.now(),az0=controls.getAzimuthalAngle();
  addTween({t0,dur:2600,update:e=>{
    const a=az0+e*0.6,r=camHome.length()-e*1.4;
    camera.position.set(Math.sin(a)*r,camHome.y-e*1.6,Math.cos(a)*r);
  }});
  updateUI();refresh12();
  setTimeout(()=>{
    document.getElementById('winEmoji').textContent=w===1?'✕':'○';
    document.getElementById('winTitle').textContent=w===1?t('p1wins'):t('p2wins');
    const loser=3-w;
    document.getElementById('winDesc').textContent=t(reason==='2'?'reason2':'reasonBlocked',{p:playerName(loser)});
    document.getElementById('winOverlay').classList.add('show');
    document.getElementById(w===1?'p1chip':'p2chip').classList.add('winner-glow');
  },1000);
}
/* keep removal beam alive while hovering (don't kill it on every tap) */
function clearWinFxSilent(){ /* beams persist during removal selection by design */ }

/* node highlight refresh (pads + marker rings) */
function refresh12(){
  if(mode!=='12'||!nodePads.length)return;
  const victim=3-current;
  const targets=new Set(),cands=new Set();
  if(!gameOver){
    if(m12.removing){for(let i=0;i<24;i++)if(m12.cells[i]===victim&&m12removable(i))cands.add(i);}
    else if(m12.selected>=0){for(let k=0;k<24;k++)if(isTarget(k))targets.add(k);}
  }
  const millSet=new Set(m12.millNodes);
  for(let i=0;i<24;i++){
    const pad=nodePads[i],ring=markRings[i];
    let e=0x000000;
    if(millSet.has(i))e=0x7a5c00;
    if(m12.selected===i)e=0x8a6d1c;
    if(i===hoverIdx&&!gameOver){
      if(m12.removing&&cands.has(i))e=0x7a1010;
      else if(targets.has(i))e=0x0b5a48;
      else if(m12.phase==='place'&&m12.cells[i]===0)e=0x554400;
      else if(m12.phase==='move'&&m12.selected<0&&m12.cells[i]===current)e=0x554400;
    }
    if(m12.removing&&cands.has(i)&&e===0x000000)e=0x4a0d0d;
    pad.material.emissive.setHex(e);
    pad.scale.setScalar(m12.selected===i?1.18:1);
    if(targets.has(i)){ring.visible=true;ring.material.color.setHex(0x4ade80);ring.material.opacity=.9;}
    else if(cands.has(i)){ring.visible=true;ring.material.color.setHex(0xff6b6b);ring.material.opacity=.9;}
    else{ring.visible=false;ring.material.opacity=0;}
  }
}

document.getElementById('btnMenuSettings').onclick=()=>{sClick();syncDraftFromState();renderSettings();document.getElementById('setOverlay').classList.add('show');};
document.getElementById('btnCancel').onclick=()=>{sClick();document.getElementById('setOverlay').classList.remove('show');};
document.getElementById('btnDefaults').onclick=()=>{sClick();draft={mode:'3',cfg:{...PRESETS.easy,diff:'easy'},flying:true,sound:draft.sound,anim:true,showR:true};renderSettings();};
document.getElementById('btnApply').onclick=()=>{
  sClick();
  const modeChanged=draft.mode!==mode;
  const cfgChanged=mode==='3'&&(draft.cfg.size!==cfg.size||draft.cfg.win!==cfg.win);
  FLY=draft.flying;localStorage.setItem('dooz_fly',FLY?'on':'off');
  ANIM=draft.anim;localStorage.setItem('dooz_anim',ANIM?'on':'off');
  SHOWR=draft.showR;localStorage.setItem('dooz_showr',SHOWR?'on':'off');
  if(draft.sound!==soundOn){soundOn=draft.sound;localStorage.setItem('dooz_sound',soundOn?'on':'off');}
  if(modeChanged){mode=draft.mode;saveMode();current=1;cfg={...draft.cfg};saveCfg();round++;saveScores();newRound(false);
    toast(t('newModeToast',{m:t(mode==='12'?'mode12':'mode3'),p:playerName(current)}));
    if(SHOWR)renderHelp(),document.getElementById('helpOverlay').classList.add('show');
  }else if(mode==='3'&&cfgChanged){cfg={...draft.cfg};saveCfg();round++;saveScores();newRound(false);toast(t('cfgApplied'));}
  else{if(mode==='12'){}else{cfg={...draft.cfg};saveCfg();}updateUI();toast(t('cfgApplied'));}
  document.getElementById('setOverlay').classList.remove('show');
};
function resetCurrentScores(){const k=mode==='12'?'m12':'m3';scores[k]={1:0,2:0,draws:0};round=1;saveScores();current=1;newRound(false);updateUI();toast(t('scoreReset'));}
document.getElementById('btnReset2').onclick=()=>{sClick();document.getElementById('setOverlay').classList.remove('show');resetCurrentScores();};

/* ----- main menu ----- */
let menuDraft='3',menuFirst=true;
function renderMenu(){
  menuDraft=menuDraft||mode;
  document.getElementById('card3').classList.toggle('sel',menuDraft==='3');
  document.getElementById('card12').classList.toggle('sel',menuDraft==='12');
  document.getElementById('menuSummary').textContent=t(menuDraft==='12'?'menuSummary12':'menuSummary3');
}
document.getElementById('card3').onclick=()=>{sClick();menuDraft='3';renderMenu();};
document.getElementById('card12').onclick=()=>{sClick();menuDraft='12';renderMenu();};
document.getElementById('btnStart').onclick=()=>{
  sClick();
  const changed=menuDraft!==mode||menuFirst;
  if(menuDraft!==mode){mode=menuDraft;saveMode();current=1;round++;saveScores();newRound(false);
    toast(t('newModeToast',{m:t(mode==='12'?'mode12':'mode3'),p:playerName(current)}));}
  document.getElementById('menuOverlay').classList.remove('show');
  if(SHOWR&&changed){renderHelp();document.getElementById('helpOverlay').classList.add('show');}
  menuFirst=false;updateUI();
};
document.getElementById('btnMode').onclick=()=>{sClick();menuDraft=mode;renderMenu();document.getElementById('menuOverlay').classList.add('show');};
document.getElementById('rulesChip').onclick=()=>{sClick();menuDraft=mode;renderMenu();document.getElementById('menuOverlay').classList.add('show');};

/* ----- help (mode-aware) ----- */
function renderHelp(){
  const ul=document.getElementById('helpList');ul.innerHTML='';
  const keys=mode==='12'?['h12_1','h12_2','h12_3','h12_4','h12_5','h12_6','h12_7','h12_8']:['h1','h2','h3','h4','h5'];
  keys.forEach(k=>{const li=document.createElement('li');li.textContent=t(k);ul.appendChild(li);});
}

/* ================= HUD / LANG ================= */
function modeName(){return t(mode==='12'?'mode12':'mode3');}
function phaseName(){return t(m12.phase==='move'?'phaseMove':'phasePlace');}
function applyLang(next,silent){
  lang=next;localStorage.setItem('dooz_lang',lang);
  document.documentElement.lang=lang==='fa'?'fa':'en';
  document.documentElement.dir=lang==='fa'?'rtl':'ltr';
  document.title=lang==='fa'?'دوز سه‌بعدی ایرانی | Persian 3D Dooz':'Persian 3D Dooz | دوز سه‌بعدی ایرانی';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(STR[lang][k]!==undefined)el.textContent=STR[lang][k];
  });
  document.getElementById('btnFa').classList.toggle('active',lang==='fa');
  document.getElementById('btnEn').classList.toggle('active',lang==='en');
  document.getElementById('btnMode').title=t('modeMenu');
  document.getElementById('rulesChip').title=t('modeMenu');
  document.body.classList.remove('lang-fade');void document.body.offsetWidth;document.body.classList.add('lang-fade');
  if(document.getElementById('setOverlay').classList.contains('show'))renderSettings();
  if(document.getElementById('menuOverlay').classList.contains('show'))renderMenu();
  if(document.getElementById('helpOverlay').classList.contains('show'))renderHelp();
  updateUI();
  if(!silent)toast(lang==='fa'?'زبان: فارسی 🇮🇷':'Language: English 🇬🇧');
}
function pcsText(p){
  if(mode!=='12')return '';
  return `${t('inHand')}: ${fmt(m12.hand[p])} • ${t('onBoard')}: ${fmt(m12count(p))}`;
}
function updateUI(){
  const sc=curScores();
  document.getElementById('scoreP1').textContent=fmt(sc[1]);
  document.getElementById('scoreP2').textContent=fmt(sc[2]);
  document.getElementById('pcs1').textContent=pcsText(1);
  document.getElementById('pcs2').textContent=pcsText(2);
  document.getElementById('pcs1').style.display=mode==='12'?'':'none';
  document.getElementById('pcs2').style.display=mode==='12'?'':'none';
  const pill=document.getElementById('statusPill');
  const p1=document.getElementById('p1chip'),p2=document.getElementById('p2chip');
  p1.classList.toggle('active',!gameOver&&current===1);
  p2.classList.toggle('active',!gameOver&&current===2);
  document.getElementById('hint').textContent=t(mode==='12'?'hint12':'hint');
  if(mode==='12'){
    document.getElementById('rulesChip').textContent=t('rules12',{m:modeName(),ph:phaseName()})+' • '+t('round',{n:fmt(round)});
    if(gameOver){pill.textContent='🏆 '+(current===1?t('p1wins'):t('p2wins'));}
    else if(m12.removing){pill.textContent=t('dooz')+' '+t('removeOne');}
    else if(m12.selected>=0){pill.textContent=t('turnOf',{p:playerName(current)})+' • '+t('chooseDest')+(FLY&&m12count(current)===3?' • '+t('flyHint'):'');}
    else pill.textContent=t('turnOf',{p:playerName(current)})+' • '+(m12.phase==='place'?t('placeAny'):t('selectOwn'));
  }else{
    document.getElementById('rulesChip').textContent=
      t('rules',{s:fmt(cfg.size),w:fmt(cfg.win),d:diffName(cfg.diff)})+' • '+t('round',{n:fmt(round)});
    if(gameOver){
      const w=findWin();
      pill.textContent = w ? '🏆 '+t('winDesc',{p:playerName(board[w[0]]),w:fmt(cfg.win)}) : '🤝 '+t('drawDesc');
    }else{
      pill.textContent=t('turnOf',{p:playerName(current)})+' • '+t('tapEmpty');
    }
  }
  pill.style.color=current===1?'var(--gold-light)':'var(--turquoise-light)';
  const sb=document.getElementById('soundBtn');
  sb.textContent=soundOn?'🔊':'🔇';sb.classList.toggle('off',!soundOn);
}
document.getElementById('btnFa').onclick=()=>{sClick();applyLang('fa');};
document.getElementById('btnEn').onclick=()=>{sClick();applyLang('en');};
document.getElementById('soundBtn').onclick=()=>{
  soundOn=!soundOn;localStorage.setItem('dooz_sound',soundOn?'on':'off');
  updateUI();toast(soundOn?t('soundOn'):t('soundOff'));if(soundOn)sClick();
};
document.getElementById('btnNew').onclick=()=>{sClick();round++;saveScores();current=current===1?2:1;newRound(true);};
document.getElementById('btnWinAgain').onclick=()=>{sClick();round++;saveScores();current=current===1?2:1;newRound(true);};
document.getElementById('btnWinClose').onclick=()=>{sClick();document.getElementById('winOverlay').classList.remove('show');};
document.getElementById('btnReset').onclick=()=>{sClick();resetCurrentScores();};
document.getElementById('btnHelp').onclick=()=>{sClick();renderHelp();document.getElementById('helpOverlay').classList.add('show');};
document.getElementById('btnHelpClose').onclick=()=>{sClick();document.getElementById('helpOverlay').classList.remove('show');};
document.getElementById('btnCam').onclick=()=>{sClick();fitCamera(false);};
document.querySelectorAll('.overlay').forEach(o=>{
  if(o.id==='menuOverlay')return;   // menu closes only via Start
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show');});
});

/* ---------- resize + loop ---------- */
function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05),now=performance.now();
  updateTweens(now);
  updateBursts(dt);
  controls.update();
  const tm=now*0.001;
  dust.rotation.y=tm*0.02;dust.position.y=Math.sin(tm*0.4)*0.2;
  dust2.rotation.y=-tm*0.015;
  pieceMeshes.forEach(m=>{if(m&&m.userData.gem)m.userData.gem.rotation.y+=dt*1.4;});
  if(mode==='12'&&markRings.length){
    const pulse=.55+.4*Math.sin(tm*6);
    markRings.forEach(r=>{if(r.visible)r.material.opacity=pulse;});
    if(m12.selected>=0&&nodePads[m12.selected])nodePads[m12.selected].scale.setScalar(1.14+0.06*Math.sin(tm*6));
  }
  if(winBurst){
    winBurst.userData.life+=dt;
    const p=winBurst.geometry.attributes.position,v=winBurst.userData.vel;
    for(let i=0;i<v.length;i++){if(!v[i])continue;
      p.array[i*3]+=v[i].x*dt;p.array[i*3+1]+=v[i].y*dt;p.array[i*3+2]+=v[i].z*dt;v[i].y-=5*dt;}
    p.needsUpdate=true;winBurst.material.opacity=Math.max(0,1-winBurst.userData.life*0.7);
  }
  renderer.render(scene,camera);
}

/* ---------- boot ---------- */
applyLang(lang,true);
newRound(false);
menuDraft=mode;renderMenu();
document.getElementById('menuOverlay').classList.add('show');
loop();
</script>
</body>
